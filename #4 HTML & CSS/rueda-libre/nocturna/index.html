<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rueda Nocturna: recorridos guiados en bicicleta por Medellín.">
  <title>Rueda Nocturna | Botones Tailwind</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-7xl flex-col justify-center gap-8 px-4 py-10 sm:px-8 lg:px-12">
    <section aria-labelledby="hero-title" class="relative isolate overflow-hidden rounded-[2rem] border border-white/10 bg-gradient-to-br from-slate-900 via-slate-950 to-black px-6 py-12 shadow-2xl sm:px-10 sm:py-16 lg:px-16">
      <div aria-hidden="true" class="absolute -right-20 -top-24 h-72 w-72 rounded-full bg-lime-300/10 blur-3xl"></div>
      <div class="relative max-w-3xl space-y-8">
        <p class="inline-flex rounded-full border border-lime-300/30 bg-lime-300/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.18em] text-lime-300">
          Nuevo · Jueves a sábado
        </p>
        <div class="space-y-4">
          <h1 id="hero-title" class="text-5xl font-black tracking-tight text-white sm:text-6xl lg:text-7xl">Rueda Nocturna</h1>
          <p class="max-w-2xl text-lg leading-relaxed text-slate-300 sm:text-xl">
            Descubre Medellín en bici cuando se encienden las luces.
          </p>
        </div>
        <ul aria-label="Datos de los recorridos" class="flex flex-wrap gap-3">
          <li class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-semibold text-slate-200 sm:text-base">3 rutas</li>
          <li class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-semibold text-slate-200 sm:text-base">Desde $55.000</li>
        </ul>
        <button type="button" class="inline-flex items-center justify-center rounded-xl bg-lime-300 px-6 py-3 font-bold text-slate-950 shadow-lg transition-colors hover:bg-lime-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
          Inscríbete
        </button>
        <p class="text-sm leading-relaxed text-slate-400">Salidas nocturnas en Medellín · 7:30 p. m.</p>
      </div>
    </section>

    <section aria-labelledby="button-kit-title" class="rounded-2xl border border-white/10 bg-slate-900/70 p-6 sm:p-8">
      <h2 id="button-kit-title" class="mb-5 text-xl font-bold text-white sm:text-2xl">Variantes de botón</h2>
      <div class="flex flex-wrap gap-4">
        <button type="button" class="inline-flex items-center justify-center rounded-xl bg-slate-700 px-6 py-3 font-bold text-white shadow-md transition-colors hover:bg-slate-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
          Explorar rutas
        </button>
        <button type="button" class="inline-flex items-center justify-center rounded-xl border border-lime-300/70 px-6 py-3 font-bold text-lime-200 transition-colors hover:bg-lime-300/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
          Consultar horarios
        </button>
      </div>
    </section>
  </main>
</body>
</html>
