name: Publicar Parche Dev

on:
  push:
    branches:
      - main
    paths:
      - 'Actividad #7 - Reto_ Parche Dev 2026 - Individual/parche-dev/**'
      - '.github/workflows/deploy-parche-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          mkdir public
          cp -a "Actividad #7 - Reto_ Parche Dev 2026 - Individual/parche-dev/." public/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar página
        id: deployment
        uses: actions/deploy-pages@v4
