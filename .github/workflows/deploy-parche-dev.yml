
name: Desplegar sitios HTML y CSS

on:
  push:
    branches:
      - main
    paths:
      - '#4 HTML & CSS/parche-dev/**'
      - '#4 HTML & CSS/rueda-libre/**'
      - '.github/workflows/deploy-parche-dev.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitios web
        run: |
          mkdir -p public/parche-dev
          mkdir -p public/rueda-libre

          cp -a "#4 HTML & CSS/parche-dev/." public/parche-dev/
          cp -a "#4 HTML & CSS/rueda-libre/." public/rueda-libre/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar sitios
        id: deployment
        uses: actions/deploy-pages@v4
