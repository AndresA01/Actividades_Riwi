
name: Publicar Parche Dev y Rueda Libre

on:
  push:
    branches:
      - main
    paths:
      - 'Actividad #7 - Reto_ Parche Dev 2026 - Individual/parche-dev/**'
      - 'Actividad #6 - HTML y CSS - Individual/rueda-libre/**'
      - '.github/workflows/deploy-parche-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          mkdir -p public/parche-dev
          mkdir -p "public/Actividad #6 - HTML y CSS - Individual/rueda-libre"

          cp -a "Actividad #7 - Reto_ Parche Dev 2026 - Individual/parche-dev/." public/parche-dev/

          cp -a "Actividad #6 - HTML y CSS - Individual/rueda-libre/." "public/Actividad #6 - HTML y CSS - Individual/rueda-libre/"

          cp -a "Actividad #7 - Reto_ Parche Dev 2026 - Individual/parche-dev/." public/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar página
        id: deployment
        uses: actions/deploy-pages@v4
